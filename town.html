<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eiken — 15 Years Later</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Cormorant+Garamond:ital,wght@0,600;1,500&display=swap" rel="stylesheet">
<style>
  :root{
    --accent: #93783a; /* overwritten per class by JS */
    --sky-top: #cfe6e0;
    --sky-bottom: #f4e9c9;
    --ground: #3c3226;
    --ground-top: #6b8f5a;
  }
  *{ box-sizing: border-box; margin:0; padding:0; }
  html, body{ height: 100%; overflow: hidden; }
  body{
    font-family: 'IBM Plex Mono', monospace;
    background: var(--sky-bottom);
    position: relative;
  }

  .hud{
    position: fixed;
    top: 16px; left: 20px;
    z-index: 20;
    font-size: 0.7rem;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: #3c3226;
    opacity: 0.75;
  }
  .hud .sub{
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 0.95rem;
    text-transform: none;
    letter-spacing: 0;
    margin-top: 2px;
    opacity: 0.8;
  }

  .sky{
    position: fixed;
    inset: 0;
    background: linear-gradient(to bottom, var(--sky-top) 0%, var(--sky-bottom) 100%);
    z-index: 0;
  }

  .viewport{
    position: relative;
    width: 100%;
    height: 100%;
    overflow: hidden;
  }

  .world{
    position: absolute;
    bottom: 0;
    left: 0;
    height: 460px;
    width: 2600px;
    will-change: transform;
  }

  /* distant town silhouettes — improved placeholder shapes, swap for real art later */
  .town-silhouette{
    position: absolute;
    bottom: 100px;
    left: 0;
    width: 100%;
    height: 340px;
    display: flex;
    align-items: flex-end;
    gap: 50px;
    opacity: 0.88;
  }
  .town-silhouette div{
    position: relative;
    width: 100px;
    background:
      radial-gradient(circle, #f2c879 0 5px, transparent 5.5px) 20px 24px,
      radial-gradient(circle, #f2c879 0 5px, transparent 5.5px) 60px 24px,
      radial-gradient(circle, #f2c879 0 5px, transparent 5.5px) 20px 64px,
      radial-gradient(circle, #f2c879 0 5px, transparent 5.5px) 60px 64px,
      #8a7060;
    background-repeat: repeat-y, repeat-y, repeat-y, repeat-y, no-repeat;
    background-size: 100px 96px, 100px 96px, 100px 96px, 100px 96px, 100%;
    border-radius: 2px 2px 0 0;
  }
  /* roof, via a classic CSS triangle */
  .town-silhouette div::before{
    content: "";
    position: absolute;
    left: 50%;
    bottom: 100%;
    transform: translateX(-50%);
    width: 0; height: 0;
    border-left: 62px solid transparent;
    border-right: 62px solid transparent;
    border-bottom: 46px solid #6b4a3a;
  }
  /* door */
  .town-silhouette div::after{
    content: "";
    position: absolute;
    left: 50%;
    bottom: 0;
    transform: translateX(-50%);
    width: 26px;
    height: 42px;
    background: #4a3226;
    border-radius: 3px 3px 0 0;
  }
  .town-silhouette div:nth-child(3n)   { background-color: #9c7c5c; }
  .town-silhouette div:nth-child(3n+1) { background-color: #7d8a76; }
  .town-silhouette div:nth-child(3n+2) { background-color: #8a7060; }
  .town-silhouette div:nth-child(3n)::before   { border-bottom-color: #5a4030; }
  .town-silhouette div:nth-child(3n+1)::before { border-bottom-color: #4d5a48; }

  .ground{
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 100px;
    background: var(--ground);
    border-top: 6px solid var(--ground-top);
  }

  .port{
    position: absolute;
    bottom: 100px;
    right: 90px;
    width: 480px;
    height: 340px;
  }
  .port .dock{
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 30px;
    background: #5b4632;
  }
  .port .post{
    position: absolute;
    bottom: 30px;
    width: 14px;
    height: 100px;
    background: #4a3a29;
  }
  .port .post:nth-child(2){ left: 24px; }
  .port .post:nth-child(3){ left: 436px; }
  .port .mast{
    position: absolute;
    bottom: 30px;
    left: 160px;
    width: 9px;
    height: 220px;
    background: #4a3a29;
  }
  .port .sail{
    position: absolute;
    bottom: 144px;
    left: 168px;
    width: 140px;
    height: 100px;
    background: #ece3cd;
    clip-path: polygon(0 0, 100% 20%, 0 100%);
  }

  .character{
    position: absolute;
    bottom: 100px;
    transform: translateX(-50%);
  }
  .character .head{
    width: 36px; height: 36px;
    border-radius: 50%;
    background: #ece3cd;
    margin: 0 auto;
  }
  .character .body{
    width: 50px; height: 72px;
    border-radius: 8px;
    background: var(--accent);
    margin: 3px auto 0;
    transition: transform 0.12s ease;
  }
  .character.walking .body{
    animation: bob 0.32s ease-in-out infinite;
  }
  @keyframes bob{
    0%, 100%{ transform: translateY(0); }
    50%{ transform: translateY(-5px); }
  }
  .character.facing-left{ transform: translateX(-50%) scaleX(-1); }
  .character.jumping .body{
    animation: none;
    transform: scaleY(1.08) scaleX(0.94);
  }
  .character img{
    display: block;
    width: auto;
  }

  .controls-hint{
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 0.68rem;
    letter-spacing: 0.05em;
    color: #3c3226;
    opacity: 0.6;
    z-index: 20;
    text-align: center;
  }

  .touch-controls{
    position: fixed;
    bottom: 20px;
    left: 0; right: 0;
    display: none;
    justify-content: space-between;
    padding: 0 24px;
    z-index: 20;
  }
  .touch-controls button{
    width: 60px; height: 60px;
    border-radius: 50%;
    border: 1px solid #3c3226;
    background: rgba(255,255,255,0.5);
    font-size: 1.3rem;
    color: #3c3226;
  }
  @media (hover: none) and (pointer: coarse){
    .touch-controls{ display: flex; }
    .controls-hint{ display: none; }
  }

  .arrival{
    position: fixed;
    inset: 0;
    z-index: 30;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(0,0,0,0.6);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.8s ease;
    text-align: center;
    padding: 24px;
  }
  .arrival.show{ opacity: 1; pointer-events: auto; }
  .arrival p{
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    color: #f4f1ea;
    font-size: 1.2rem;
    max-width: 34ch;
  }

  /* ---------- COMBAT ---------- */
  .projectile{
    position: absolute;
    pointer-events: none;
  }
  .arrow-shot{
    width: 68px;
    height: 13px;
    background: linear-gradient(to right, transparent, #111 30%, #111);
    border-radius: 3px;
  }
  /* the sprite's glowing core sits flush against the source art's right edge in every
     frame (zero transparent padding there) — anchoring the <img> by its right edge, inside
     a wrapper positioned at the projectile's actual x/y, keeps the core fixed at that point
     regardless of how long the trailing flame is in a given frame. Mirroring the wrapper
     (not the image) for leftward flight keeps the same anchor point correct in both
     directions, the same pattern used for the warrior's slash-wrap. */
  .spell-wrap{
    position: absolute;
    pointer-events: none;
  }
  .spell-sprite{
    position: absolute;
    right: 0;
    bottom: 0;
    transform: translateY(50%); /* the core sits ~50% down each frame's height — this centers it on the wrap's anchor row */
    display: block;
    width: auto;
    pointer-events: none;
  }

  .charge-ring{
    position: absolute;
    width: 78px;
    height: 78px;
    margin-left: -39px;
    border: 3px solid #5a6f9e;
    border-radius: 50%;
    pointer-events: none;
    transform: scale(0.2);
    opacity: 0.7;
  }
  .charge-ring.charging{
    animation: chargeGrow 2s linear forwards;
  }
  @keyframes chargeGrow{
    0%{ transform: scale(0.2); opacity: 0.5; }
    100%{ transform: scale(1.6); opacity: 1; }
  }

  .slash-wrap{
    position: absolute;
    pointer-events: none;
  }
  .slash{
    position: absolute;
    left: 0;
    bottom: 0;
    width: 78px;
    height: 10px;
    margin-left: -16px;
    background: linear-gradient(to right, transparent, #111, transparent);
    border-radius: 3px;
    transform-origin: 10% 50%;
    pointer-events: none;
  }
  .slash.slash-down{ animation: slashDown 0.22s ease-out forwards; }
  .slash.slash-up{ animation: slashUp 0.22s ease-out forwards; }
  @keyframes slashDown{
    0%{ transform: rotate(-65deg); opacity: 1; }
    100%{ transform: rotate(65deg); opacity: 0; }
  }
  @keyframes slashUp{
    0%{ transform: rotate(65deg); opacity: 1; }
    100%{ transform: rotate(-65deg); opacity: 0; }
  }

  /* ============ CREATOR MODE — strip this whole block (CSS + HTML + JS) before ship ============ */
  .creator-panel{
    position: fixed;
    top: 16px;
    right: 16px;
    z-index: 9999;
    background: rgba(10,10,10,0.92);
    border: 1px solid #c8a24a;
    border-radius: 4px;
    padding: 14px 16px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.68rem;
    letter-spacing: 0.05em;
    color: #f4f1ea;
    display: none;
    flex-direction: column;
    gap: 10px;
    min-width: 168px;
  }
  .creator-panel.show{ display: flex; }
  .creator-panel .creator-label{
    text-transform: uppercase;
    color: #c8a24a;
    font-size: 0.62rem;
    letter-spacing: 0.12em;
  }
  .creator-panel .creator-group{
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .creator-panel button{
    font-family: inherit;
    font-size: 0.68rem;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    background: transparent;
    border: 1px solid #93783a;
    color: #f4f1ea;
    padding: 7px 10px;
    border-radius: 100px;
    cursor: pointer;
    transition: border-color 0.15s ease, background 0.15s ease;
  }
  .creator-panel button:hover{ border-color: #c8a24a; background: rgba(200,162,74,0.12); }
  .creator-panel button.active{ border-color: #c8a24a; background: rgba(200,162,74,0.22); }
  /* ============ END CREATOR MODE CSS ============ */
</style>
</head>
<body>

<div class="sky"></div>

<div class="hud">
  <div id="hudName">Traveler</div>
  <div class="sub" id="hudSub">walking toward the port</div>
</div>

<div class="viewport">
  <div class="world" id="world">
    <div class="town-silhouette">
      <div style="height:200px"></div>
      <div style="height:290px"></div>
      <div style="height:150px"></div>
      <div style="height:240px"></div>
      <div style="height:180px"></div>
      <div style="height:330px"></div>
      <div style="height:210px"></div>
      <div style="height:260px"></div>
    </div>

    <div class="ground"></div>

    <div class="port" id="port">
      <div class="post"></div>
      <div class="post"></div>
      <div class="mast"></div>
      <div class="sail"></div>
      <div class="dock"></div>
    </div>

    <div class="character" id="character">
      <div class="head"></div>
      <div class="body"></div>
    </div>
  </div>
</div>

<p class="controls-hint">← → or A / D to walk · ↑ or W to jump · Space to attack</p>
<div class="touch-controls">
  <button id="leftBtn">←</button>
  <button id="jumpBtn">↑</button>
  <button id="attackBtn">⚔</button>
  <button id="rightBtn">→</button>
</div>

<div class="arrival" id="arrival">
  <p id="arrivalText">You've reached the port.<br>(Nothing built past here yet.)</p>
</div>

<!-- ============ CREATOR MODE — strip this whole block (CSS + HTML + JS) before ship ============ -->
<div class="creator-panel" id="creatorPanel">
  <div class="creator-label">Creator Mode</div>
  <div class="creator-group" id="creatorClassGroup">
    <button data-set-class="ranger">Ranger</button>
    <button data-set-class="mage">Mage</button>
    <button data-set-class="warrior">Warrior</button>
  </div>
  <button id="creatorSkipBtn">Skip to next stage →</button>
</div>
<!-- ============ END CREATOR MODE HTML ============ -->

<script>
  // ---------- load save data from the naming sequence ----------
  let save = { class: 'ranger', name: 'Traveler', gender: '' };
  try{
    const raw = localStorage.getItem('eiken_save');
    if (raw) save = Object.assign(save, JSON.parse(raw));
  }catch(e){}

  const accents = { ranger: '#5a7a4a', mage: '#5a6f9e', warrior: '#9e4f3f' };
  document.documentElement.style.setProperty('--accent', accents[save.class] || '#93783a');
  document.getElementById('hudName').textContent = save.name || 'Traveler';

  // ---------- sprite system (currently only mage has real art; others keep the placeholder shape) ----------
  // Only right-facing art exists (mage_left_v3, despite the name — confirmed by testing: it
  // looks right, not left). Left is the same images mirrored via CSS instead of a second art
  // set. idle/walk/jump still carry per-frame render heights, since the source canvases genuinely
  // do vary in padding around a same-scale character. charge/cast do NOT get that treatment —
  // those frames are a crouching/gathering pose that's actually smaller within its own canvas,
  // not just cropped tighter, so scaling by canvas height was shrinking an already-compact pose
  // even further. They render at the flat baseline height instead (idleH == totalH below).
  const BASE_SPRITE_HEIGHT = 120;
  const FLOAT_FRAME_MS = 130; // fixed display time per float frame — independent of movement SPEED, so
                               // scrolling stays the same while this only controls how fast the pose cycles
  const IDLE_CYCLE_MS = 2600; // slow, relaxed loop for the standing animation
  const JUMP_ANIM_MS = 1400; // approximates the actual jump arc duration (2 * JUMP_POWER / GRAVITY, in ms)
  function mkFrame(src, totalH, idleH){ return { src, height: Math.round(BASE_SPRITE_HEIGHT * (totalH / idleH)) }; }
  // bounces 0..length-1..0 instead of hard-cutting back to 0 — used for the float loop so it
  // reads as a continuous hover (up then back down) rather than a snap-restart
  function pingPongIndex(step, length){
    if (length <= 1) return 0;
    const period = 2 * (length - 1);
    const phase = step % period;
    return phase < length ? phase : period - phase;
  }

  const MAGE_FRAMES = {
    idle: [
      mkFrame('assets/sprites/mage_left_v3/idle1.png', 419, 419),
      mkFrame('assets/sprites/mage_left_v3/idle2.png', 419, 419),
      mkFrame('assets/sprites/mage_left_v3/idle3.png', 419, 419),
      mkFrame('assets/sprites/mage_left_v3/idle4.png', 419, 419),
      mkFrame('assets/sprites/mage_left_v3/idle5.png', 409, 419),
      mkFrame('assets/sprites/mage_left_v3/idle6.png', 414, 419)
    ],
    walk: [
      // "walk" now drives floating/hovering instead of a walking stride —
      // the mage no longer steps, he hovers while moving left/right
      mkFrame('assets/sprites/mage_left_v3/float1.png', 331, 419),
      mkFrame('assets/sprites/mage_left_v3/float2.png', 340, 419),
      mkFrame('assets/sprites/mage_left_v3/float3.png', 346, 419),
      mkFrame('assets/sprites/mage_left_v3/float4.png', 339, 419),
      mkFrame('assets/sprites/mage_left_v3/float5.png', 335, 419),
      mkFrame('assets/sprites/mage_left_v3/float6.png', 333, 419),
      mkFrame('assets/sprites/mage_left_v3/float7.png', 321, 419),
      mkFrame('assets/sprites/mage_left_v3/float8.png', 317, 419),
      mkFrame('assets/sprites/mage_left_v3/float9.png', 322, 419),
      mkFrame('assets/sprites/mage_left_v3/float10.png', 325, 419),
      mkFrame('assets/sprites/mage_left_v3/float11.png', 327, 419),
      mkFrame('assets/sprites/mage_left_v3/float12.png', 320, 419)
    ],
    jump: [
      mkFrame('assets/sprites/mage_left_v3/jump1.png', 355, 419),
      mkFrame('assets/sprites/mage_left_v3/jump2.png', 310, 419),
      mkFrame('assets/sprites/mage_left_v3/jump3.png', 273, 419),
      mkFrame('assets/sprites/mage_left_v3/jump4.png', 368, 419),
      mkFrame('assets/sprites/mage_left_v3/jump5.png', 348, 419),
      mkFrame('assets/sprites/mage_left_v3/jump6.png', 333, 419),
      mkFrame('assets/sprites/mage_left_v3/jump7.png', 282, 419),
      mkFrame('assets/sprites/mage_left_v3/jump8.png', 365, 419)
    ],
    charge: [
      mkFrame('assets/sprites/mage_left_v3/charge1.png', 334, 334),
      mkFrame('assets/sprites/mage_left_v3/charge2.png', 293, 293),
      mkFrame('assets/sprites/mage_left_v3/charge3.png', 260, 260),
      mkFrame('assets/sprites/mage_left_v3/charge4.png', 284, 284),
      mkFrame('assets/sprites/mage_left_v3/charge5.png', 363, 363),
      mkFrame('assets/sprites/mage_left_v3/charge6.png', 413, 413)
    ],
    cast: [
      mkFrame('assets/sprites/mage_left_v3/charge7.png', 444, 444),
      mkFrame('assets/sprites/mage_left_v3/charge8.png', 394, 394)
    ]
  };

  const SPRITE_SETS = {
    mage: {
      right: { frames: MAGE_FRAMES, mirror: false },
      left:  { frames: MAGE_FRAMES, mirror: true }
    }
  };

  // preload every sprite image up front so the browser has them cached before the player can
  // ever trigger them — without this, the first use of any frame shows a blank/stale gap while
  // it fetches over the network, which is what caused the frozen legs, the vanishing-on-cast,
  // and the jarring jump-cut once loading finally caught up. left/right share the same underlying
  // frame set (see MAGE_FRAMES above), so this dedupes by object identity to avoid preloading
  // the same 30 images twice.
  function preloadAllSprites(){
    const seen = new Set();
    Object.values(SPRITE_SETS).forEach(cls => {
      Object.values(cls).forEach(dirSet => {
        if (seen.has(dirSet.frames)) return;
        seen.add(dirSet.frames);
        const frames = dirSet.frames;
        const list = [...frames.idle, ...frames.walk, ...frames.jump, ...frames.charge, ...frames.cast];
        list.forEach(f => { const img = new Image(); img.src = f.src; });
      });
    });
  }
  preloadAllSprites();

  let spriteSet = null; // the {right, left} pair for the current class, or null if no real art yet
  let spriteImg = null;
  let currentFrameKey = '';

  // ---------- world / camera setup ----------
  const world = document.getElementById('world');
  const character = document.getElementById('character');
  const port = document.getElementById('port');
  const arrival = document.getElementById('arrival');

  const WORLD_WIDTH = 2600;
  const GROUND_MARGIN = 40;
  let charX = 120;
  let facing = 1; // 1 = right, -1 = left
  let lastMovingTime = 0;
  let wasAnimMoving = false; // tracks the (moving || inTurnGrace) value from the previous tick
  let walkAnimStart = 0;     // timestamp the current unbroken movement segment began — resets the
                              // float loop back to the foot-down frame each time movement restarts
  let arrived = false;

  function applyCharacterVisualForClass(){
    spriteSet = SPRITE_SETS[save.class] || null;
    currentFrameKey = '';
    character.innerHTML = '';
    if (spriteSet){
      spriteImg = document.createElement('img');
      spriteImg.alt = '';
      const initialDirSet = spriteSet[facing === -1 ? 'left' : 'right'];
      const initial = initialDirSet.frames.idle[0];
      spriteImg.src = initial.src;
      spriteImg.style.height = initial.height + 'px';
      spriteImg.style.transform = initialDirSet.mirror ? 'scaleX(-1)' : 'none';
      character.appendChild(spriteImg);
      character.classList.remove('walking', 'jumping', 'facing-left');
    } else {
      spriteImg = null;
      const head = document.createElement('div');
      head.className = 'head';
      const body = document.createElement('div');
      body.className = 'body';
      character.appendChild(head);
      character.appendChild(body);
    }
  }
  applyCharacterVisualForClass();

  const keys = {};
  window.addEventListener('keydown', e => {
    keys[e.key] = true;
    if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') {
      e.preventDefault();
      tryJump();
    }
    if (e.key === ' ') {
      e.preventDefault(); // stop the page from scrolling on spacebar
      if (!e.repeat) handleAttackStart();
    }
  });
  window.addEventListener('keyup', e => {
    keys[e.key] = false;
    if (e.key === ' ') handleAttackEnd();
  });

  const leftBtn = document.getElementById('leftBtn');
  const rightBtn = document.getElementById('rightBtn');
  const jumpBtn = document.getElementById('jumpBtn');
  const attackBtn = document.getElementById('attackBtn');
  let touchLeft = false, touchRight = false;
  leftBtn.addEventListener('touchstart', e => { e.preventDefault(); touchLeft = true; });
  leftBtn.addEventListener('touchend', () => touchLeft = false);
  rightBtn.addEventListener('touchstart', e => { e.preventDefault(); touchRight = true; });
  rightBtn.addEventListener('touchend', () => touchRight = false);
  jumpBtn.addEventListener('touchstart', e => { e.preventDefault(); tryJump(); });
  attackBtn.addEventListener('touchstart', e => { e.preventDefault(); handleAttackStart(); });
  attackBtn.addEventListener('touchend', e => { e.preventDefault(); handleAttackEnd(); });

  // ---------- jump physics ----------
  const GROUND_BOTTOM = 100;
  const GRAVITY = 0.31;
  const JUMP_POWER = 13;
  let jumpHeight = 0;
  let jumpVelocity = 0;
  let isJumping = false;
  let jumpStart = 0;

  function tryJump(){
    if (isJumping || arrived) return;
    isJumping = true;
    jumpStart = performance.now();
    jumpVelocity = JUMP_POWER;
  }

  // ---------- combat ----------
  const projectiles = []; // {el, x, vx} plus, for spell projectiles only: {img, frameStart, lastFrameIdx}
  const ARROW_SPEED = 7;
  const SPELL_SPEED = 6;

  // spell projectile flight sprite — 6 frames, cycled on a forward loop for as long as it's
  // airborne. Uniform scale-down (not per-frame height-normalized like the character sprites):
  // the core sphere appears to be a constant raw-pixel size across all 6 source frames, only
  // the trailing flame's bounding box grows/shrinks, so scaling by each frame's own canvas
  // height (like the character system does) would be the wrong tool here — it would shrink
  // the core on the frames with the longest trail, the same mistake fixed for the mage's
  // charge/cast frames earlier.
  const SPELL_SPRITE_SCALE = 0.4;
  const SPELL_FRAME_MS = 70; // within the requested 60-80ms range
  function mkSpellFrame(src, nativeH){ return { src, height: Math.round(nativeH * SPELL_SPRITE_SCALE) }; }
  const SPELL_PROJECTILE_FRAMES = [
    mkSpellFrame('assets/sprites/spell_projectile/f1.png', 148),
    mkSpellFrame('assets/sprites/spell_projectile/f2.png', 185),
    mkSpellFrame('assets/sprites/spell_projectile/f3.png', 188),
    mkSpellFrame('assets/sprites/spell_projectile/f4.png', 222),
    mkSpellFrame('assets/sprites/spell_projectile/f5.png', 180),
    mkSpellFrame('assets/sprites/spell_projectile/f6.png', 148)
  ];
  SPELL_PROJECTILE_FRAMES.forEach(f => { const img = new Image(); img.src = f.src; }); // preload, same reasoning as preloadAllSprites() above

  const CHARGE_TIME = 2000;
  const RANGER_COOLDOWN = 1500; // ms between shots
  const WARRIOR_COOLDOWN = 425; // ms before the next swing can trigger
  const SLASH_REACH = 62; // distance from character the swing is anchored — this is the effective hitbox range

  let isCharging = false;
  let chargeStart = 0;
  let chargeRingEl = null;
  let lastSlashTime = 0;
  let lastRangerShot = 0;
  let nextSlash = 'down';
  let castPoseUntil = 0;
  let castStart = 0;
  const CAST_DURATION = 360; // long enough to show all release frames, not just flash through them

  function torsoY(){
    return GROUND_BOTTOM + jumpHeight + 57;
  }

  function spawnProjectile(className, speedMultiplier){
    const el = document.createElement('div');
    el.className = 'projectile ' + className;
    const startX = charX + facing * 18;
    el.style.left = startX + 'px';
    el.style.bottom = torsoY() + 'px';
    world.appendChild(el);
    projectiles.push({ el, x: startX, vx: speedMultiplier * facing });
  }

  function fireRangerArrow(){
    spawnProjectile('arrow-shot', ARROW_SPEED);
  }

  function spawnSpellProjectile(){
    const startX = charX + facing * 18;
    const wrap = document.createElement('div');
    wrap.className = 'projectile spell-wrap';
    wrap.style.left = startX + 'px';
    wrap.style.bottom = torsoY() + 'px';
    if (facing === -1) wrap.style.transform = 'scaleX(-1)'; // flip lives on the wrapper, same pattern as the warrior's slash-wrap

    const img = document.createElement('img');
    img.className = 'spell-sprite';
    img.alt = '';
    wrap.appendChild(img);
    world.appendChild(wrap);

    const p = { el: wrap, img, x: startX, vx: SPELL_SPEED * facing, frameStart: performance.now(), lastFrameIdx: -1 };
    projectiles.push(p);
    updateSpellFrame(p); // set the first frame immediately so it isn't blank for one tick
  }

  function updateSpellFrame(p){
    const elapsed = performance.now() - p.frameStart;
    const idx = Math.floor(elapsed / SPELL_FRAME_MS) % SPELL_PROJECTILE_FRAMES.length;
    if (idx !== p.lastFrameIdx){
      p.lastFrameIdx = idx;
      const frame = SPELL_PROJECTILE_FRAMES[idx];
      p.img.src = frame.src;
      p.img.style.height = frame.height + 'px';
    }
  }

  function fireMageSpell(){
    spawnSpellProjectile();
    castStart = performance.now();
    castPoseUntil = castStart + CAST_DURATION;
  }

  function doWarriorSlash(){
    const direction = nextSlash;
    nextSlash = direction === 'down' ? 'up' : 'down';
    lastSlashTime = performance.now();

    const wrap = document.createElement('div');
    wrap.className = 'slash-wrap';
    wrap.style.left = (charX + facing * SLASH_REACH) + 'px';
    wrap.style.bottom = torsoY() + 'px';
    if (facing === -1) wrap.style.transform = 'scaleX(-1)'; // flip lives on the wrapper so it doesn't fight the rotate animation below

    const el = document.createElement('div');
    el.className = 'slash slash-' + direction;
    wrap.appendChild(el);
    world.appendChild(wrap);
    setTimeout(() => wrap.remove(), 240);
  }

  function startMageCharge(){
    if (isCharging || arrived) return;
    isCharging = true;
    chargeStart = performance.now();
    // the placeholder charge-ring is only needed when there's no real sprite art —
    // the mage's own charge frames already draw a hand-drawn glow, so a second
    // generic CSS ring stacked on top of it would just be redundant (and was sized
    // for the old tiny placeholder character, not this one — badly oversized here).
    if (!spriteSet){
      chargeRingEl = document.createElement('div');
      chargeRingEl.className = 'charge-ring charging';
      chargeRingEl.style.left = charX + 'px';
      chargeRingEl.style.bottom = torsoY() + 'px';
      world.appendChild(chargeRingEl);
    }
  }

  function cancelMageCharge(fired){
    isCharging = false;
    if (chargeRingEl){
      chargeRingEl.remove();
      chargeRingEl = null;
    }
  }

  function handleAttackStart(){
    if (arrived) return;
    const now = performance.now();

    if (save.class === 'ranger'){
      if (now - lastRangerShot < RANGER_COOLDOWN) return; // still on cooldown, input ignored
      lastRangerShot = now;
      fireRangerArrow();
    } else if (save.class === 'warrior'){
      if (now - lastSlashTime < WARRIOR_COOLDOWN) return; // still on cooldown, input ignored
      doWarriorSlash();
    } else if (save.class === 'mage'){
      startMageCharge();
    }
  }

  function handleAttackEnd(){
    if (save.class === 'mage' && isCharging){
      cancelMageCharge(false); // released early — no fire
    }
  }

  function updateProjectiles(){
    for (let i = projectiles.length - 1; i >= 0; i--){
      const p = projectiles[i];
      p.x += p.vx;
      p.el.style.left = p.x + 'px';
      if (p.img) updateSpellFrame(p); // only spell projectiles carry .img — arrows are untouched
      if (p.x < -60 || p.x > WORLD_WIDTH + 60){
        p.el.remove();
        projectiles.splice(i, 1);
      }
    }
  }

  function updateCharge(){
    if (!isCharging) return;
    if (chargeRingEl) chargeRingEl.style.left = charX + 'px';
    if (performance.now() - chargeStart >= CHARGE_TIME){
      fireMageSpell();
      cancelMageCharge(true);
    }
  }

  function updateSpriteFrame(moving){
    if (!spriteSet) return; // no real art for this class yet — placeholder handles itself via CSS classes

    const dir = facing === -1 ? 'left' : 'right';
    const dirSet = spriteSet[dir];
    const frames = dirSet.frames;

    let key, frame;
    if (isJumping){
      const progress = (performance.now() - jumpStart) / JUMP_ANIM_MS;
      const idx = Math.min(Math.floor(progress * frames.jump.length), frames.jump.length - 1);
      key = 'jump' + idx; frame = frames.jump[idx];
    } else if (performance.now() < castPoseUntil){
      const progress = (performance.now() - castStart) / CAST_DURATION;
      const idx = Math.min(Math.floor(progress * frames.cast.length), frames.cast.length - 1);
      key = 'cast' + idx; frame = frames.cast[idx];
    } else if (isCharging){
      const progress = (performance.now() - chargeStart) / CHARGE_TIME;
      const idx = Math.min(Math.floor(progress * frames.charge.length), frames.charge.length - 1);
      key = 'charge' + idx; frame = frames.charge[idx];
    } else if (moving){
      // frame 0 is the foot-down/grounded pose — it only plays once, right as movement
      // begins, then the loop bounces back and forth across the remaining frames without
      // ever returning to it (until movement stops and restarts)
      const elapsed = performance.now() - walkAnimStart;
      if (elapsed < FLOAT_FRAME_MS){
        key = 'walk0'; frame = frames.walk[0];
      } else {
        const rotFrames = frames.walk.length - 1;
        const step = Math.floor((elapsed - FLOAT_FRAME_MS) / FLOAT_FRAME_MS);
        const idx = 1 + pingPongIndex(step, rotFrames);
        key = 'walk' + idx; frame = frames.walk[idx];
      }
    } else {
      const perFrameMs = IDLE_CYCLE_MS / frames.idle.length;
      const idx = Math.floor(performance.now() / perFrameMs) % frames.idle.length;
      key = 'idle' + idx; frame = frames.idle[idx];
    }

    const fullKey = dir + '_' + key;
    if (fullKey !== currentFrameKey){
      currentFrameKey = fullKey;
      spriteImg.src = frame.src;
      spriteImg.style.height = frame.height + 'px';
      spriteImg.style.transform = dirSet.mirror ? 'scaleX(-1)' : 'none';
    }
  }

  const SPEED = 1.2;
  const portTriggerX = WORLD_WIDTH - 310;

  function update(){
    const movingLeft = keys['ArrowLeft'] || keys['a'] || keys['A'] || touchLeft;
    const movingRight = keys['ArrowRight'] || keys['d'] || keys['D'] || touchRight;
    let moving = false;

    if (!arrived){
      if (movingLeft){ charX -= SPEED; facing = -1; moving = true; }
      if (movingRight){ charX += SPEED; facing = 1; moving = true; }
      charX = Math.max(GROUND_MARGIN, Math.min(WORLD_WIDTH - GROUND_MARGIN, charX));
    }

    // bridge tiny gaps (a keyboard's key-up/key-down don't land on the exact same tick when
    // quickly reversing direction) so the sprite doesn't flash an idle pose mid-turn — this is
    // purely visual, it doesn't move charX, it just keeps showing a walk frame for ~90ms
    if (moving) lastMovingTime = performance.now();
    const inTurnGrace = !moving && (performance.now() - lastMovingTime < 90);
    const animMoving = (moving || inTurnGrace) && !isJumping;
    if (animMoving && !wasAnimMoving) walkAnimStart = performance.now(); // fresh segment — replay foot-down
    wasAnimMoving = animMoving;

    if (isJumping){
      jumpVelocity -= GRAVITY;
      jumpHeight += jumpVelocity;
      if (jumpHeight <= 0){
        jumpHeight = 0;
        jumpVelocity = 0;
        isJumping = false;
      }
    }

    character.style.left = charX + 'px';
    character.style.bottom = (GROUND_BOTTOM + jumpHeight) + 'px';
    if (!spriteSet){
      character.classList.toggle('facing-left', facing === -1);
      character.classList.toggle('walking', moving && !isJumping);
      character.classList.toggle('jumping', isJumping);
    }
    updateSpriteFrame(animMoving);

    const viewportWidth = window.innerWidth;
    let camX = charX - viewportWidth / 2;
    camX = Math.max(0, Math.min(WORLD_WIDTH - viewportWidth, camX));
    world.style.transform = `translateX(${-camX}px)`;

    if (!arrived && charX >= portTriggerX){
      arrived = true;
      arrival.classList.add('show');
    }

    updateProjectiles();
    updateCharge();

    requestAnimationFrame(update);
  }
  update();
</script>

<script>
  // ============ CREATOR MODE — strip this whole block before ship ============
  (function(){
    const panel = document.getElementById('creatorPanel');
    const classButtons = document.querySelectorAll('#creatorClassGroup [data-set-class]');
    const skipBtn = document.getElementById('creatorSkipBtn');
    function refreshActiveClassButton(){
      classButtons.forEach(b => b.classList.toggle('active', b.dataset.setClass === save.class));
    }
    refreshActiveClassButton();
    window.addEventListener('keydown', e => {
      if (e.key !== '`') return;
      const active = document.activeElement;
      if (active && (active.tagName === 'INPUT' || active.tagName === 'TEXTAREA')) return;
      e.preventDefault();
      panel.classList.toggle('show');
    });
    classButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        // live-switch only — does not touch eiken_save, so a reload restores the real save
        save.class = btn.dataset.setClass;
        document.documentElement.style.setProperty('--accent', accents[save.class] || '#93783a');
        applyCharacterVisualForClass();
        refreshActiveClassButton();
      });
    });
    skipBtn.addEventListener('click', () => {
      // nudge the character to the next checkpoint and let the normal arrival logic fire
      charX = portTriggerX;
    });
  })();
  // ============ END CREATOR MODE ============
</script>

</body>
