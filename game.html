<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eiken — The Falling Star</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=IBM+Plex+Mono:wght@400;500&family=Work+Sans:wght@400;500;600&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  :root{
    --brass: #c8a24a;
    --brass-dim: #93783a;
    --white: #f4f1ea;
    --dim: #8c8a86;
  }
  *{ box-sizing: border-box; margin:0; padding:0; }
  html, body{ height: 100%; }
  body{
    background: #000;
    color: var(--white);
    font-family: 'Work Sans', sans-serif;
    overflow: hidden;
    position: relative;
  }

  .back-link{
    position: fixed;
    top: 20px; left: 24px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.65rem;
    letter-spacing: 0.05em;
    color: var(--dim);
    text-decoration: none;
    opacity: 0;
    animation: fadeIn 1s ease forwards;
    animation-delay: 5.2s;
    z-index: 10;
  }
  .back-link:hover{ color: var(--brass); }

  /* ---------- STARFIELD ---------- */
  .starfield{
    position: fixed;
    inset: 0;
    z-index: 0;
    transition: opacity 1.3s ease;
  }
  .starfield.fade-out{ opacity: 0; }

  /* Placeholder ocean layer — swap this background for a real image later:
     background: url('assets/ocean.jpg') center/cover no-repeat; */
  .ocean-bg{
    position: fixed;
    inset: 0;
    z-index: 0;
    opacity: 0;
    transition: opacity 1.3s ease;
    background: radial-gradient(ellipse at 50% 30%, #123a44 0%, #0a222c 55%, #050f14 100%);
  }
  .ocean-bg.show{ opacity: 1; }
  .bg-star{
    position: absolute;
    background: var(--white);
    border-radius: 50%;
    animation: twinkle linear infinite;
  }
  @keyframes twinkle{
    0%, 100% { opacity: var(--min-op, 0.15); }
    50% { opacity: var(--max-op, 0.9); }
  }

  /* ---------- INTRO TEXT ---------- */
  .intro-text{
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    z-index: 5;
    padding: 24px;
    opacity: 0;
    animation: introSequence 4.6s ease forwards;
    pointer-events: none;
  }
  .intro-text p{
    font-family: 'Cormorant Garamond', serif;
    font-weight: 500;
    font-style: italic;
    font-size: clamp(1.3rem, 3.2vw, 2rem);
    max-width: 30ch;
    line-height: 1.5;
    color: var(--white);
  }
  @keyframes introSequence{
    0%   { opacity: 0; }
    18%  { opacity: 1; }
    70%  { opacity: 1; }
    100% { opacity: 0; }
  }

  /* ---------- SCENE ---------- */
  .scene{
    position: relative;
    z-index: 2;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    opacity: 0;
    animation: fadeIn 1.4s ease forwards;
    animation-delay: 4.5s;
    padding: 24px;
  }

  @keyframes fadeIn{ to{ opacity: 1; } }

  .map-stage{
    width: min(560px, 92vw);
  }
  .map-stage svg{ width: 100%; height: auto; overflow: visible; }

  .star-spin{
    transform-origin: center;
    animation: spin 9s linear infinite;
  }
  @keyframes spin{ to{ transform: rotate(360deg); } }

  .star-pos{
    transition: transform 1.6s cubic-bezier(0.5, 0, 0.25, 1);
  }

  .region path{
    fill: rgba(200,162,74,0.10);
    stroke: var(--brass-dim);
    stroke-width: 1;
    transition: fill 0.25s ease, stroke 0.25s ease;
    cursor: pointer;
  }
  .region:hover path, .region.selected path{
    fill: rgba(200,162,74,0.28);
    stroke: var(--brass);
  }
  .region.faded{ opacity: 0.25; pointer-events: none; }
  .region .label{
    font-family: 'Cormorant Garamond', serif;
    font-size: 15px;
    fill: var(--white);
    text-anchor: middle;
    pointer-events: none;
  }
  .region .kanji{
    font-size: 11px;
    fill: var(--brass-dim);
    text-anchor: middle;
    pointer-events: none;
    letter-spacing: 0.05em;
  }

  .impact{
    fill: none;
    stroke: var(--brass);
    stroke-width: 1.5;
    opacity: 0;
  }
  .impact.show{
    animation: ripple 1.1s ease-out forwards;
  }
  @keyframes ripple{
    0%   { r: 2;  opacity: 0.9; }
    100% { r: 34; opacity: 0; }
  }

  .info-panel{
    margin-top: 26px;
    text-align: center;
    min-height: 108px;
  }

  .instruction{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.75rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--dim);
  }

  .flavor{
    margin-top: 10px;
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 1.15rem;
    color: var(--white);
    max-width: 40ch;
    min-height: 1.4em;
  }

  .confirm-buttons{
    margin-top: 18px;
    display: flex;
    gap: 14px;
    justify-content: center;
  }
  .confirm-buttons button{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.72rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    background: transparent;
    border: 1px solid var(--brass-dim);
    color: var(--white);
    padding: 10px 24px;
    border-radius: 100px;
    cursor: pointer;
    transition: border-color 0.2s ease, background 0.2s ease;
  }
  .confirm-buttons button:hover{
    border-color: var(--brass);
    background: rgba(200,162,74,0.1);
  }
  #yesBtn{ border-color: var(--brass); }

  [hidden]{ display: none !important; }

  .reveal-card{
    position: fixed;
    inset: 0;
    z-index: 20;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 1.1s ease;
    background: rgba(0,0,0,0.55);
  }
  .reveal-card.show{
    opacity: 1;
    pointer-events: auto;
  }
  .reveal-card img{
    max-height: 82vh;
    max-width: 88vw;
    width: auto;
    box-shadow: 0 0 60px rgba(0,0,0,0.6);
    border-radius: 4px;
  }

  .reveal-continue{
    position: absolute;
    bottom: 40px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.7rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--white);
    background: transparent;
    border: 1px solid var(--brass);
    padding: 10px 26px;
    border-radius: 100px;
    cursor: pointer;
    opacity: 0;
    animation: fadeIn 1s ease forwards;
    animation-delay: 1s;
  }
  .reveal-continue:hover{ background: rgba(200,162,74,0.12); }

  /* ---------- NAMING SCREEN ---------- */
  .naming-screen{
    position: fixed;
    inset: 0;
    z-index: 25;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    background: rgba(0,0,0,0.86);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.8s ease;
    padding: 24px;
  }
  .naming-screen.show{ opacity: 1; pointer-events: auto; }

  .naming-screen h2{
    font-family: 'Cormorant Garamond', serif;
    font-weight: 500;
    font-style: italic;
    font-size: clamp(1.4rem, 3vw, 1.9rem);
    max-width: 30ch;
    margin-bottom: 34px;
  }

  .name-input{
    background: transparent;
    border: none;
    border-bottom: 1px solid var(--brass-dim);
    color: var(--white);
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.4rem;
    text-align: center;
    padding: 8px 4px;
    width: min(320px, 80vw);
    outline: none;
  }
  .name-input:focus{ border-bottom-color: var(--brass); }
  .name-input::placeholder{ color: var(--dim); font-style: italic; }

  .gender-row{
    margin-top: 30px;
    display: flex;
    gap: 14px;
  }
  .gender-btn{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.72rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    background: transparent;
    border: 1px solid var(--brass-dim);
    color: var(--white);
    padding: 10px 24px;
    border-radius: 100px;
    cursor: pointer;
    transition: border-color 0.2s ease, background 0.2s ease;
  }
  .gender-btn:hover{ border-color: var(--brass); background: rgba(200,162,74,0.08); }
  .gender-btn.selected{ border-color: var(--brass); background: rgba(200,162,74,0.18); }

  .naming-continue{
    margin-top: 36px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.72rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    background: transparent;
    border: 1px solid var(--brass-dim);
    color: var(--dim);
    padding: 10px 30px;
    border-radius: 100px;
    cursor: not-allowed;
    opacity: 0.5;
    transition: opacity 0.2s ease, color 0.2s ease, border-color 0.2s ease;
  }
  .naming-continue.ready{
    cursor: pointer;
    opacity: 1;
    color: var(--white);
    border-color: var(--brass);
  }

  /* ---------- RETURNING STAR + FLASH ---------- */
  .return-star{
    position: fixed;
    top: 8%;
    left: 8%;
    width: 18px;
    height: 18px;
    z-index: 30;
    opacity: 0;
    transition: transform 1.3s cubic-bezier(0.5,0,0.3,1), opacity 0.4s ease;
  }
  .return-star svg{ width: 100%; height: 100%; animation: spin 1.6s linear infinite; }
  .return-star.show{ opacity: 1; }

  .white-flash{
    position: fixed;
    inset: 0;
    z-index: 35;
    background: #fff;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.35s ease;
  }
  .white-flash.show{ opacity: 1; transition: opacity 0.15s ease; }

  .black-out{
    position: fixed;
    inset: 0;
    z-index: 34;
    background: #000;
    opacity: 0;
    pointer-events: none;
    transition: opacity 1.1s ease;
  }
  .black-out.show{ opacity: 1; }

  /* ---------- RETRO DIALOGUE SCREEN ---------- */
  .dialogue-screen{
    position: fixed;
    inset: 0;
    z-index: 40;
    background: #000;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.6s ease;
  }
  .dialogue-screen.show{ opacity: 1; pointer-events: auto; }

  .dialogue-box{
    font-family: 'Press Start 2P', monospace;
    color: #fff;
    font-size: clamp(0.85rem, 2vw, 1.15rem);
    line-height: 2.4;
    text-align: center;
    padding: 24px;
  }
  .dialogue-box .cursor{
    display: inline-block;
    width: 0.6em;
    animation: blink 0.9s step-end infinite;
  }
  @keyframes blink{ 50%{ opacity: 0; } }

  .dialogue-continue{
    display: block;
    margin: 40px auto 0;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.7rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    background: transparent;
    border: 1px solid var(--brass);
    color: var(--white);
    padding: 10px 26px;
    border-radius: 100px;
    cursor: pointer;
    opacity: 0;
    transition: opacity 0.6s ease;
  }
  .dialogue-continue.show{ opacity: 1; }

  @media (prefers-reduced-motion: reduce){
    .star-spin{ animation: none; }
    .star-pos{ transition: none; }
    .intro-text, .scene, .back-link{ animation: none; opacity: 1; }
  }
</style>
</head>
<body>

<div class="starfield" id="starfield"></div>
<div class="ocean-bg" id="oceanBg"></div>

<a class="back-link" href="index.html">← back to the map</a>

<div class="intro-text">
  <p>The North Star is falling.<br>You decide where it lands.</p>
</div>

<div class="scene">
  <div class="map-stage">
    <svg viewBox="0 0 520 500" xmlns="http://www.w3.org/2000/svg">

      <!-- Ranger Coast -->
      <g class="region" data-class="ranger" data-name="Ranger"
         data-flavor="You are born as one with nature. Your arrows fly with the wind.">
        <path d="M60,60 C40,50 30,75 42,92 C30,100 34,120 55,122 C75,124 100,112 106,92 C112,72 90,68 60,60 Z"/>
        <text class="label" x="70" y="146">Ranger Coast</text>
        <text class="kanji" x="70" y="163">狩人</text>
      </g>

      <!-- Mage Spire -->
      <g class="region" data-class="mage" data-name="Mage"
         data-flavor="You are born blessed by the elements. They are yours to call on.">
        <path d="M382,58 C365,44 340,56 340,78 C328,86 332,108 352,114 C374,120 404,112 412,90 C420,68 402,66 382,58 Z"/>
        <text class="label" x="376" y="138">Mage Spire</text>
        <text class="kanji" x="376" y="155">魔術師</text>
      </g>

      <!-- Warrior Hold -->
      <g class="region" data-class="warrior" data-name="Warrior"
         data-flavor="You are born an immovable wall. And an unbreakable spear.">
        <path d="M182,368 C160,360 150,384 164,400 C152,412 160,432 182,434 C206,436 232,424 236,402 C240,380 214,376 182,368 Z"/>
        <text class="label" x="198" y="458">Warrior Hold</text>
        <text class="kanji" x="198" y="475">戦士</text>
      </g>

      <!-- impact ripple, positioned by JS on landing -->
      <circle class="impact" id="impact" cx="0" cy="0" r="2"/>

      <!-- the North Star -->
      <g class="star-pos" id="starPos" transform="translate(260,42)">
        <g class="star-spin">
          <path d="M0,-15 C2,-4 4,-2 15,0 C4,2 2,4 0,15 C-2,4 -4,2 -15,0 C-4,-2 -2,-4 0,-15 Z"
                fill="#f4f1ea" stroke="#c8a24a" stroke-width="0.6"/>
        </g>
      </g>

    </svg>
  </div>

  <div class="info-panel">
    <p class="instruction" id="instruction">Choose where the star lands.</p>
    <p class="flavor" id="flavor"></p>
    <div class="confirm-buttons" id="confirmButtons" hidden>
      <button id="yesBtn">Yes</button>
      <button id="noBtn">Choose again</button>
    </div>
  </div>
</div>

<div class="reveal-card" id="revealCard">
  <img id="revealImg" src="" alt="">
  <button class="reveal-continue" id="revealContinue">Continue →</button>
</div>

<div class="naming-screen" id="namingScreen">
  <h2>What do they call you?</h2>
  <input class="name-input" id="nameInput" type="text" placeholder="Enter a name" maxlength="18" autocomplete="off">
  <div class="gender-row">
    <button class="gender-btn" data-gender="Boy">Boy</button>
    <button class="gender-btn" data-gender="Girl">Girl</button>
  </div>
  <button class="naming-continue" id="namingContinue">Continue</button>
</div>

<div class="return-star" id="returnStar">
  <svg viewBox="0 0 30 30" xmlns="http://www.w3.org/2000/svg">
    <path d="M15,0 C17,11 19,13 30,15 C19,17 17,19 15,30 C13,19 11,17 0,15 C11,13 13,11 15,0 Z" fill="#f4f1ea" stroke="#c8a24a" stroke-width="0.5"/>
  </svg>
</div>

<div class="white-flash" id="whiteFlash"></div>
<div class="black-out" id="blackOut"></div>

<div class="dialogue-screen" id="dialogueScreen">
  <div class="dialogue-box">
    <p id="dialogueLine1"></p>
    <p id="dialogueLine2"></p>
    <button class="dialogue-continue" id="dialogueContinue">Continue →</button>
  </div>
</div>

<script>
  // ---------- starfield ----------
  const field = document.getElementById('starfield');
  const STAR_COUNT = 130;
  for (let i = 0; i < STAR_COUNT; i++) {
    const s = document.createElement('div');
    s.className = 'bg-star';
    const size = Math.random() * 1.8 + 0.6;
    s.style.width = size + 'px';
    s.style.height = size + 'px';
    s.style.left = Math.random() * 100 + 'vw';
    s.style.top = Math.random() * 100 + 'vh';
    s.style.setProperty('--min-op', (Math.random() * 0.2 + 0.05).toFixed(2));
    s.style.setProperty('--max-op', (Math.random() * 0.5 + 0.5).toFixed(2));
    s.style.animationDuration = (Math.random() * 4 + 2.5) + 's';
    s.style.animationDelay = (Math.random() * 4) + 's';
    field.appendChild(s);
  }

  // ---------- region data & coordinates (matches path centers above) ----------
  const targets = {
    ranger:  { x: 70,  y: 90 },
    mage:    { x: 376, y: 90 },
    warrior: { x: 198, y: 400 }
  };

  const regions = document.querySelectorAll('.region');
  const instruction = document.getElementById('instruction');
  const flavor = document.getElementById('flavor');
  const confirmButtons = document.getElementById('confirmButtons');
  const yesBtn = document.getElementById('yesBtn');
  const noBtn = document.getElementById('noBtn');
  const starPos = document.getElementById('starPos');
  const impact = document.getElementById('impact');

  let hovered = null;
  let selected = null;
  let decided = false;

  function showFlavorFor(el){
    flavor.textContent = el.dataset.flavor;
  }

  function resetFlavor(){
    if (!selected) flavor.textContent = '';
  }

  regions.forEach(r => {
    r.addEventListener('mouseenter', () => {
      if (decided) return;
      hovered = r;
      showFlavorFor(r);
    });
    r.addEventListener('mouseleave', () => {
      if (decided) return;
      hovered = null;
      resetFlavor();
    });
    r.addEventListener('click', () => {
      if (decided) return;
      selected = r;
      showFlavorFor(r);
      instruction.textContent = `Are you sure you want to be born as a ${r.dataset.name}?`;
      confirmButtons.hidden = false;
      regions.forEach(other => other.classList.toggle('selected', other === r));
    });
  });

  noBtn.addEventListener('click', () => {
    selected = null;
    confirmButtons.hidden = true;
    instruction.textContent = 'Choose where the star lands.';
    flavor.textContent = '';
    regions.forEach(r => r.classList.remove('selected'));
  });

  const starfieldEl = document.getElementById('starfield');
  const oceanBg = document.getElementById('oceanBg');

  yesBtn.addEventListener('click', () => {
    if (!selected) return;
    decided = true;
    const cls = selected.dataset.class;
    const name = selected.dataset.name;
    const t = targets[cls];

    confirmButtons.hidden = true;
    instruction.textContent = '';
    flavor.textContent = '';
    regions.forEach(r => { if (r !== selected) r.classList.add('faded'); });

    // Step 1 — the star returns to center and zooms in
    starPos.style.transitionDuration = '0.9s';
    starPos.style.transform = 'translate(260px, 250px) scale(1.8)';

    // Step 2 — the sky bleeds into ocean
    setTimeout(() => {
      starfieldEl.classList.add('fade-out');
      oceanBg.classList.add('show');
    }, 850);

    // Step 3 — the star falls onto the chosen island
    setTimeout(() => {
      starPos.style.transitionDuration = '1.4s';
      starPos.style.transform = `translate(${t.x}px, ${t.y}px) scale(0.4)`;
    }, 1150);

    // Step 4 — landing
    setTimeout(() => {
      impact.setAttribute('cx', t.x);
      impact.setAttribute('cy', t.y);
      impact.classList.add('show');
      instruction.textContent = `You are born a ${name}.`;
    }, 2650);

    // Step 5 — reveal the class card
    setTimeout(() => {
      const revealCard = document.getElementById('revealCard');
      const revealImg = document.getElementById('revealImg');
      revealImg.src = `assets/${cls}-card.png`;
      revealImg.alt = `${name} card`;
      revealCard.classList.add('show');
      window._eikenClass = cls;
    }, 3400);
  });

  // ---------- reveal card -> naming screen ----------
  document.getElementById('revealContinue').addEventListener('click', () => {
    document.getElementById('revealCard').classList.remove('show');
    document.getElementById('namingScreen').classList.add('show');
  });

  // ---------- naming screen ----------
  const nameInput = document.getElementById('nameInput');
  const genderBtns = document.querySelectorAll('.gender-btn');
  const namingContinue = document.getElementById('namingContinue');
  let chosenGender = null;

  function checkNamingReady(){
    const ready = nameInput.value.trim().length > 0 && chosenGender;
    namingContinue.classList.toggle('ready', !!ready);
  }
  nameInput.addEventListener('input', checkNamingReady);
  genderBtns.forEach(btn => {
    btn.addEventListener('click', () => {
      genderBtns.forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
      chosenGender = btn.dataset.gender;
      checkNamingReady();
    });
  });

  namingContinue.addEventListener('click', () => {
    const finalName = nameInput.value.trim();
    if (!finalName || !chosenGender) return;
    runBirthSequence(finalName, chosenGender);
  });

  // ---------- the star returns, flash, black, typewriter ----------
  function runBirthSequence(finalName, gender){
    document.getElementById('namingScreen').classList.remove('show');

    const returnStar = document.getElementById('returnStar');
    const whiteFlash = document.getElementById('whiteFlash');
    const blackOut = document.getElementById('blackOut');

    // star appears and flies toward the center of the frame (where the baby sits in the card art)
    returnStar.classList.add('show');
    requestAnimationFrame(() => {
      returnStar.style.transform = `translate(${window.innerWidth/2 - window.innerWidth*0.08 - 9}px, ${window.innerHeight*0.42 - window.innerHeight*0.08 - 9}px) scale(0.4)`;
    });

    setTimeout(() => { whiteFlash.classList.add('show'); }, 1250);
    setTimeout(() => {
      whiteFlash.classList.remove('show');
      blackOut.classList.add('show');
    }, 1500);

    setTimeout(() => {
      document.getElementById('dialogueScreen').classList.add('show');
      typeDialogue(finalName);
      // save the choice for later scenes
      try{
        localStorage.setItem('eiken_save', JSON.stringify({
          class: window._eikenClass, name: finalName, gender: gender
        }));
      }catch(e){}
    }, 2600);
  }

  function typeDialogue(finalName){
    const line1 = document.getElementById('dialogueLine1');
    const line2 = document.getElementById('dialogueLine2');
    const continueBtn = document.getElementById('dialogueContinue');
    const text1 = `(${finalName})`;
    const text2 = '15 years later...';

    let i = 0;
    line1.textContent = '';
    line2.textContent = '';

    function typeLine1(){
      if (i <= text1.length){
        line1.textContent = text1.slice(0, i) + (i < text1.length ? '' : '');
        i++;
        setTimeout(typeLine1, 90);
      } else {
        setTimeout(typeLine2, 700);
      }
    }
    let j = 0;
    function typeLine2(){
      if (j <= text2.length){
        line2.textContent = text2.slice(0, j);
        j++;
        setTimeout(typeLine2, 70);
      } else {
        continueBtn.classList.add('show');
      }
    }
    typeLine1();
  }

  document.getElementById('dialogueContinue').addEventListener('click', () => {
    window.location.href = 'town.html';
  });
</script>
