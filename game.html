<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eiken — Landing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=IBM+Plex+Mono:wght@400;500&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --deep-sea: #0a1b28;
    --chart-teal: #1e4e4a;
    --brass: #c8a24a;
    --brass-dim: #93783a;
    --rust: #b0563b;
    --parchment: #ece3cd;
    --parchment-dim: #b9ae91;
    --line: rgba(200, 162, 74, 0.22);
  }
  *{ box-sizing: border-box; margin:0; padding:0; }
  body{
    background: var(--deep-sea);
    color: var(--parchment);
    font-family: 'Work Sans', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header{
    padding: 24px 28px;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    border-bottom: 1px solid var(--line);
  }
  .mark{
    font-family: 'IBM Plex Mono', monospace;
    letter-spacing: 0.22em;
    font-size: 0.7rem;
    color: var(--brass);
    text-transform: uppercase;
  }
  .back-link{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.68rem;
    color: var(--parchment-dim);
    text-decoration: none;
    letter-spacing: 0.05em;
  }
  .back-link:hover{ color: var(--brass); }
  main{
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 60px 24px;
    text-align: center;
  }
  h1{
    font-family: 'Cormorant Garamond', serif;
    font-weight: 600;
    font-size: clamp(2rem, 4.5vw, 3rem);
  }
  .lede{
    margin-top: 12px;
    color: var(--parchment-dim);
    max-width: 46ch;
  }
  .choices{
    margin-top: 56px;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
    max-width: 780px;
    width: 100%;
  }
  .choice{
    background: transparent;
    border: 1px solid var(--line);
    border-radius: 3px;
    padding: 28px 20px;
    color: var(--parchment);
    font-family: inherit;
    cursor: pointer;
    transition: border-color 0.2s ease, transform 0.2s ease, background 0.2s ease;
    text-align: center;
  }
  .choice:hover{
    border-color: var(--brass-dim);
    transform: translateY(-3px);
  }
  .choice.selected{
    border-color: var(--brass);
    background: rgba(200,162,74,0.08);
  }
  .choice-glyph{
    width: 30px; height: 30px;
    margin: 0 auto 14px;
  }
  .choice-glyph svg{ width:100%; height:100%; }
  .choice h3{
    font-family: 'Cormorant Garamond', serif;
    font-weight: 600;
    font-size: 1.25rem;
    margin-bottom: 6px;
  }
  .choice p{
    color: var(--parchment-dim);
    font-size: 0.82rem;
  }
  .confirm{
    margin-top: 34px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.78rem;
    color: var(--brass);
    min-height: 1.2em;
    letter-spacing: 0.02em;
  }
  .begin{
    margin-top: 22px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.75rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    background: transparent;
    color: var(--parchment-dim);
    border: 1px solid var(--line);
    padding: 12px 28px;
    border-radius: 100px;
    cursor: not-allowed;
    opacity: 0.5;
    transition: opacity 0.2s ease, color 0.2s ease, border-color 0.2s ease, cursor 0.2s ease;
  }
  .begin.ready{
    cursor: pointer;
    opacity: 1;
    color: var(--parchment);
    border-color: var(--brass);
  }
  .begin.ready:hover{ background: rgba(200,162,74,0.1); }
  @media (max-width: 640px){
    .choices{ grid-template-columns: 1fr; }
  }
  @media (prefers-reduced-motion: reduce){
    .choice, .begin{ transition: none; }
  }
</style>
</head>
<body>
<header>
  <div class="mark">Eiken · Landing</div>
  <a class="back-link" href="index.html">← back to the map</a>
</header>
<main>
  <h1>Pick your shore.</h1>
  <p class="lede">This decides where you wash up first — not who you are for good. Nothing here is final yet; there's nothing past this screen to break.</p>
  <div class="choices" role="group" aria-label="Choose a starting class">
    <button class="choice" data-class="ranger" data-label="Ranger Coast">
      <div class="choice-glyph"><svg viewBox="0 0 24 24" fill="none" stroke="#c8a24a" stroke-width="1.3"><path d="M4 20 L14 4 L16 8 L8 20 Z"/><path d="M13 6 L18 6 L18 11"/></svg></div>
      <h3>Ranger</h3>
      <p>Land first, questions later.</p>
    </button>
    <button class="choice" data-class="warrior" data-label="Warrior Hold">
      <div class="choice-glyph"><svg viewBox="0 0 24 24" fill="none" stroke="#c8a24a" stroke-width="1.3"><path d="M12 3 L19 7 V13 C19 17 16 20 12 21 C8 20 5 17 5 13 V7 Z"/><path d="M12 8 V15"/></svg></div>
      <h3>Warrior</h3>
      <p>Straight through the front door.</p>
    </button>
    <button class="choice" data-class="mage" data-label="Mage Spire">
      <div class="choice-glyph"><svg viewBox="0 0 24 24" fill="none" stroke="#c8a24a" stroke-width="1.3"><circle cx="12" cy="9" r="4"/><path d="M12 13 V21 M9 21 H15"/></svg></div>
      <h3>Mage</h3>
      <p>The long way, on purpose.</p>
    </button>
  </div>
  <p class="confirm" id="confirmText"></p>
  <button class="begin" id="beginBtn" disabled>Begin</button>
</main>
<script>
  const choices = document.querySelectorAll('.choice');
  const confirmText = document.getElementById('confirmText');
  const beginBtn = document.getElementById('beginBtn');
  let selected = null;
  choices.forEach(btn => {
    btn.addEventListener('click', () => {
      choices.forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
      selected = btn.dataset.class;
      confirmText.textContent = `Bound to the ${btn.dataset.label}.`;
      beginBtn.disabled = false;
      beginBtn.classList.add('ready');
    });
  });
  beginBtn.addEventListener('click', () => {
    if (!selected) return;
    confirmText.textContent = `Bound to the ${document.querySelector('.choice.selected').dataset.label}. (Nothing built past here yet.)`;
  });
</script>
</body>
</html>
